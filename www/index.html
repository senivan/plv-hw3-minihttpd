<!doctype html>
<html>
  <head>
    <meta charset="utf-8"/>
    <title>minihttpd</title>
  </head>
  <body style="font-family: sans-serif;">
    <h1>minihttpd</h1>
    <p>Static files are served from <code>root_dir</code>.</p>
    <p>Storage API:</p>
    <ul>
      <li><code>POST /files/&lt;path&gt;</code> upload</li>
      <li><code>GET /files/&lt;path&gt;</code> download</li>
      <li><code>DELETE /files/&lt;path&gt;</code> delete</li>
    </ul>
  </body>
</html>
